name: SDK validation

on: [push, pull_request, workflow_dispatch, workflow_call]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MPLBACKEND: Agg

jobs:
  core:
    name: NumPy ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python scripts/check_release.py --public

  minimum-numpy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.24.4 .
      - run: python scripts/check_release.py --public

  torch-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install .
      - run: python scripts/check_release.py --public --require-torch
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          include-hidden-files: true
          name: torch-cpu-validation
          path: .release-artifacts/release_validation.json

  notebooks:
    name: notebooks ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[tutorial]"
      - run: python -m ipykernel install --user --name nexqus --display-name "Python (NexQus)"
      - run: python scripts/run_notebooks.py --engine jupyter --kernel nexqus
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          include-hidden-files: true
          name: jupyter-validation-${{ matrix.os }}-${{ matrix.python }}
          path: |
            .release-artifacts/notebook_execution.json
            notebooks/*.ipynb

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install ".[release]"
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_distribution.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          include-hidden-files: true
          name: candidate-distributions
          path: |
            dist/*
            .release-artifacts/distribution_validation.json

  independent-correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install ".[benchmark-compare,visualization]"
      - run: python -m unittest discover -s tests -p test_inspection.py
      - run: python benchmarks/run.py --suite smoke --threads 1
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          include-hidden-files: true
          name: independent-simulator-correctness
          path: .release-artifacts/independent-benchmarks

  explainability-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -p test_explain.py -v
      - run: python examples/explain_circuits.py
      - run: npm install --no-save --no-package-lock jsdom@26.1.0
      - run: python examples/nlp_similarity.py --export .release-artifacts/nlp-similarity.html
      - run: node scripts/check_nlp_similarity_ui.cjs .release-artifacts/nlp-similarity.html
      - run: python examples/train_sentence_pairs.py --epochs 2 --seeds 7
      - run: node scripts/check_qnlp_training_ui.cjs
      - run: node scripts/check_explain_ui.cjs
      - run: python -m unittest discover -s tests -p test_molecules.py -v
      - run: python examples/molecular_viewer.py
      - run: node scripts/check_molecule_ui.cjs
      - run: python examples/quantum_maze.py --export .release-artifacts/maze/lesson.html
      - run: node scripts/check_maze_ui.cjs
      - run: python examples/quantum_maze_walk.py --output .release-artifacts/maze-walk
      - run: node scripts/check_maze_walk_ui.cjs
      - run: python examples/glued_trees.py
      - run: node scripts/check_glued_trees_ui.cjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          include-hidden-files: true
          name: circuit-explanation-examples
          path: |
            .release-artifacts/qnlp-training
            .release-artifacts/nlp-similarity.html
            .release-artifacts/explanations
            .release-artifacts/molecules
            .release-artifacts/maze
            .release-artifacts/maze-walk
            .release-artifacts/glued-trees

  braket-local:
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install ".[braket]"
      - run: python -m unittest discover -s tests -p test_braket.py -v
      - run: python -m unittest discover -s tests/braket -v
      - run: python examples/braket_local.py --local

  qgan-chemistry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install ".[chemistry,tutorial]"
      - run: python -m unittest discover -s tests/chemistry -v
      - run: python examples/qgan_distribution.py
      - run: python examples/h2_vqe.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          include-hidden-files: true
          name: qgan-and-h2-examples
          path: |
            .release-artifacts/qgan
            .release-artifacts/h2

  image-gans:
    name: image GANs ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[tutorial,image-gan]"
      - run: python -m unittest discover -s tests/image_gan -v
      - run: python examples/image_gan.py --mode all --steps 2 --samples 16 --batch-size 2
      - run: python examples/image_gan.py --mode hybrid --architecture dcgan --training regularized --latent-skip --size 8 --steps 2 --samples 16 --batch-size 2 --hidden 16 --learning-rate .0002 --output-dir .release-artifacts/image-gans-regularized
      - run: python -m ipykernel install --user --name nexqus --display-name "Python (NexQus)"
      - run: python scripts/run_notebooks.py --engine jupyter --kernel nexqus --require-image-gan
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          include-hidden-files: true
          name: image-gans-${{ matrix.os }}-${{ matrix.python }}
          path: |
            .release-artifacts/image-gans
            .release-artifacts/image-gans-regularized
            .release-artifacts/notebook_execution.json
            notebooks/11_image_gans.ipynb

  core-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install . pip-audit
      - run: python -c "import numpy; print('numpy==' + numpy.__version__)" > core-audit-requirements.txt
      - run: python -c "from pathlib import Path; Path('.release-artifacts').mkdir(exist_ok=True)"
      - run: python -m pip_audit --strict --disable-pip --no-deps -r core-audit-requirements.txt -f json -o .release-artifacts/dependency_audit_core.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          include-hidden-files: true
          name: core-dependency-audit
          path: .release-artifacts/dependency_audit_core.json

  nlp-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install ".[nlp-parser]"
      - run: python -m unittest discover -s tests -p test_nlp.py -v
      - run: python -m unittest discover -s tests/nlp -v
      - run: python examples/nlp_building_blocks.py
