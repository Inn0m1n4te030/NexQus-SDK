name: SDK validation

on: [push, pull_request, workflow_dispatch, workflow_call]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  MPLBACKEND: Agg

jobs:
  core:
    name: NumPy ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python scripts/check_release.py --public

  minimum-numpy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.24.4 .
      - run: python scripts/check_release.py --public

  torch-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install .
      - run: python scripts/check_release.py --public --require-torch
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: torch-cpu-validation
          path: docs/release_validation.json

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install ".[tutorial]"
      - run: python -m ipykernel install --user --name nexqus --display-name "Python (NexQus)"
      - run: python scripts/run_notebooks.py --engine jupyter --kernel nexqus
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: jupyter-validation
          path: |
            docs/notebook_execution.json
            notebooks/*.ipynb

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install ".[release]"
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_distribution.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: candidate-distributions
          path: |
            dist/*
            docs/distribution_validation.json

  core-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install . pip-audit
      - run: python -c "import numpy; print('numpy==' + numpy.__version__)" > core-audit-requirements.txt
      - run: python -m pip_audit --strict --disable-pip --no-deps -r core-audit-requirements.txt -f json -o docs/dependency_audit_core.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: core-dependency-audit
          path: docs/dependency_audit_core.json
