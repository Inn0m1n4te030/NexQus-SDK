name: Publish reviewed distribution

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Package index
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true
      version:
        description: Exact source version, for example 1.3.0rc1 (TestPyPI) or 1.3.0 (PyPI)
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      TARGET_INDEX: ${{ inputs.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install ".[release]"
      - name: Check version and production status
        run: |
          python - <<'PY'
          import os
          from packaging.version import Version
          from nexqus import __version__
          assert os.environ['REQUESTED_VERSION'] == __version__, 'Requested version differs from source'
          if os.environ['TARGET_INDEX'] == 'pypi':
              assert not Version(__version__).is_prerelease, 'Use TestPyPI for this release candidate'
          PY
      - run: python scripts/check_release.py --public
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_distribution.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.repository }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Publish to TestPyPI
        if: inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish stable version to PyPI
        if: inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
