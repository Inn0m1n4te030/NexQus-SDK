[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexqus-sdk"
version = "0.6.0"
description = "NexQus quantum circuit simulation SDK"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
gpu = ["torch>=2.2"]
benchmark = ["threadpoolctl>=3.1"]
tutorial = ["matplotlib>=3.7", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6", "jupyterlab>=4"]

[tool.setuptools.packages.find]
where = ["src"]
